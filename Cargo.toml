[package]
name = "mirrorrust"
version = "1.0.0"
edition = "2021"
description = "Rust client for the ModelMirros protocol"
license = "ISC"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
num-bigint = "0.4"
num-traits = "0.2"
thiserror = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
